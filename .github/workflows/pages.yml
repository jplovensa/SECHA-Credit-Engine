name: Deploy SECHA prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node for validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate prototype
        run: |
          npm run check
          npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static artifact
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          cp -R assets _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
